# 宿主装载插件时核对 ABI 指纹，指纹里带着 rustc 的 release 号
# （见框架 crates/arona/build.rs），编译器版本不一致的 dll 会被直接拒载。
# 所以这里的版本必须与框架仓库同名文件逐字一致，本地 rustup 与 CI 都按这一份走。
#
# 升级流程：框架那边改版本 -> 重编宿主 -> 这里改成同一个版本 -> 重编插件 -> 一起发版。
# 只改这一边不改那边，产出的 dll 挂不上宿主。
[toolchain]
channel = "1.98.0"
# 与框架仓库同名文件保持一致：只钉 channel，不写 components。
# components 会让每一次 cargo 都先去补装组件，补装失败即整条命令报错，
# 网络不畅时还会留下半装的工具链。rustfmt/clippy 请显式装一次：
#   rustup component add rustfmt clippy
