[package]
name = "bluearchive-plugin"
version = "0.4.4"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLinLoli/BlueArchiveAronaPlugin"
description = "碧蓝档案功能插件：抽卡/活动/攻略/塔罗/名字记录/备份恢复等，插入 Arona-rs 框架运行"

# 本包是独立仓库的根，不再被任何 workspace 收养
[workspace]

[lib]
name = "bluearchive_plugin"
path = "src/lib.rs"
# cdylib 产出框架启动时扫描 plugins/ 装载的 bluearchive_plugin.dll；
# rlib 那份只给 `cargo test` 用。宿主永远不链接本 crate——插件与框架之间
# 只有运行期的 dll 这一层关系，框架的 Cargo.toml 里不会出现这里的名字。
crate-type = ["cdylib", "rlib"]

[dependencies]
# Arona 框架：按 git 标签依赖，与本仓库发布说明里写的宿主版本一一对应。
# 只有在改框架本体、要立刻编译验证时才临时切回相邻目录的 path 依赖，改完切回来：
#   arona = { package = "arona-rs", git = "https://github.com/YuLinLoli/Arona-rs", tag = "v1.1.0", default-features = false }
# 当前停在 path：接口需求已经跨过了已发布的标签——符号布局 5 那批（Bot/Group/Member 对象模型、
# 聊天记录库走宿主侧 trait 出口、Image 句柄）不在已推送的 v1.0.0 里，符号布局 6 起定时任务改走
# 宿主通道（framework.jobs()），本地 v1.1.0 标签（布局 5）也还没有，而框架 HEAD 已抬到布局 8。
# 框架的发布名换成了 arona-rs（`arona` 在 crates.io 上早被别的项目占了），库名仍是 arona，
# 所以源码里的 `use arona::…` 一个字都不用改，只在依赖行重命名一次。
# gui 由宿主决定，插件这边一律不强制打开（框架的 PLUGIN_DEVELOPMENT.md §16）。
arona = { package = "arona-rs", path = "../Arona-rs/crates/arona", version = "1.1.0", default-features = false }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
# 出站 HTTP 走 `arona::runtime::http`（宿主那份客户端代发），本 crate 不再链接 reqwest：
# dll 里自带一份会把 hyper 的后台任务投到插件那份没有上下文的 tokio 上，见 PLUGIN_DEVELOPMENT.md §14.1
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
once_cell = "1"
log = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 字形栅格化不在这里：字面那一层（ab_glyph + 有界字形缓存）收在框架的 arona::runtime::text
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
# 只有 `#[cfg(test)]` 的联调用例需要一个假 OneBot 端点（走 WS 握手），
# 不该跟着链进交付的 dll，所以放在 dev-dependencies 而不是 dependencies。
tokio-tungstenite = "0.24"
